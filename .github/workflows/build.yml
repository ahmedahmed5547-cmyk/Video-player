name: Build PureVideoPlayer (GitHub & Play)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Auto-Unpack Latest ZIP or Nested Folder & Sync Version
        run: |
          DETECTED_VER=""
          LATEST_ZIP=$(find . -maxdepth 2 -type f -name "PureVideoPlayer*.zip" | sort -V | tail -n 1 || true)
          if [ -n "$LATEST_ZIP" ]; then
            echo "Found uploaded archive $LATEST_ZIP — extracting into repository root..."
            ZVER=$(echo "$LATEST_ZIP" | grep -oE '[0-9]+\.[0-9]+' | tail -n 1 || true)
            if [ -n "$ZVER" ]; then DETECTED_VER="$ZVER"; fi
            unzip -o "$LATEST_ZIP"
            find . -maxdepth 2 -type f -name "PureVideoPlayer*.zip" -delete
          fi
          NESTED_DIR=$(find . -maxdepth 2 -type d -name "PureVideoPlayer*" | sort -V | tail -n 1 || true)
          if [ -n "$NESTED_DIR" ] && [ -d "$NESTED_DIR/app" ]; then
            echo "Found nested folder $NESTED_DIR — syncing into repository root..."
            DVER=$(echo "$NESTED_DIR" | grep -oE '[0-9]+\.[0-9]+' | tail -n 1 || true)
            if [ -n "$DVER" ]; then DETECTED_VER="$DVER"; fi
            cp -rf "$NESTED_DIR"/* .
            find . -maxdepth 2 -type d -name "PureVideoPlayer*" -exec rm -rf {} +
          fi
          CODE_VER=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          if [ -n "$DETECTED_VER" ] && [ "$DETECTED_VER" != "$CODE_VER" ]; then
            HIGHEST_VER=$(printf "%s\n%s\n" "$DETECTED_VER" "$CODE_VER" | sort -V | tail -n 1)
            sed -i "s/versionName = \"$CODE_VER\"/versionName = \"$HIGHEST_VER\"/g" app/build.gradle.kts
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests (GitHub & Play Flavors)
        run: gradle testGithubDebugUnitTest testPlayDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug & Signed Release APKs + Google Play AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VER=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          if [ -z "$VER" ]; then VER="38.07"; fi
          echo "APP_VERSION=$VER" >> $GITHUB_ENV
          gradle assembleGithubDebug assemblePlayDebug assembleGithubRelease assemblePlayRelease bundlePlayRelease --no-daemon --stacktrace
          mkdir -p dist_outputs
          find app/build/outputs/apk/github/debug -name "*.apk" -exec cp {} "dist_outputs/PureVideoPlayer-v${VER}-github-debug.apk" \;
          find app/build/outputs/apk/play/debug -name "*.apk" -exec cp {} "dist_outputs/PureVideoPlayer-v${VER}-play-debug.apk" \;
          find app/build/outputs/apk/github/release -name "*.apk" -exec cp {} "dist_outputs/PureVideoPlayer-v${VER}-github-release.apk" \;
          find app/build/outputs/apk/play/release -name "*.apk" -exec cp {} "dist_outputs/PureVideoPlayer-v${VER}-play-release.apk" \;
          find app/build/outputs/bundle/playRelease -name "*.aab" -exec cp {} "dist_outputs/PureVideoPlayer-v${VER}-play-release.aab" \;

      - name: Upload Signed Release APKs & Google Play Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: PureVideoPlayer-v${{ env.APP_VERSION }}-Packages
          path: |
            dist_outputs/*.apk
            dist_outputs/*.aab
          if-no-files-found: error
