name: Build PureVideoPlayer (GitHub & Play)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Run Unit Tests (GitHub & Play Flavors)
        run: gradle testGithubDebugUnitTest testPlayDebugUnitTest --no-daemon --stacktrace

      - name: Prepare Release Keystore (Uses GitHub Secrets if set, otherwise bundled release.keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ci_release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/ci_release.keystore" >> $GITHUB_ENV
          else
            echo "Using bundled app/release.keystore for automatic signing"
          fi

      - name: Build Debug & Signed Release APKs + Google Play AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleGithubDebug assemblePlayDebug assembleGithubRelease assemblePlayRelease bundlePlayRelease --no-daemon --stacktrace
          mkdir -p dist_outputs
          find app/build/outputs/apk/github/debug -name "*.apk" -exec cp {} dist_outputs/PureVideoPlayer-v38.02-github-debug.apk \;
          find app/build/outputs/apk/play/debug -name "*.apk" -exec cp {} dist_outputs/PureVideoPlayer-v38.02-play-debug.apk \;
          find app/build/outputs/apk/github/release -name "*.apk" -exec cp {} dist_outputs/PureVideoPlayer-v38.02-github-release.apk \;
          find app/build/outputs/apk/play/release -name "*.apk" -exec cp {} dist_outputs/PureVideoPlayer-v38.02-play-release.apk \;
          find app/build/outputs/bundle/playRelease -name "*.aab" -exec cp {} dist_outputs/PureVideoPlayer-v38.02-play-release.aab \;

      - name: Upload Signed Release APKs & Google Play Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: PureVideoPlayer-v38.02-Release-and-Debug-Packages
          path: |
            dist_outputs/*.apk
            dist_outputs/*.aab
          if-no-files-found: error
