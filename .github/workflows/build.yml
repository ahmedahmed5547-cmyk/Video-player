name: Build Google Play AAB & Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Latest Version ZIP (If Uploaded as ZIP) & Auto-Fix XML Entities
        run: |
          LATEST_ZIP=$(ls -v PureVideoPlayer_v*.zip 2>/dev/null | tail -n 1 || true)
          if [ -n "$LATEST_ZIP" ]; then
            echo "Extracting latest version archive: $LATEST_ZIP"
            unzip -o "$LATEST_ZIP"
            rm -f *.zip
          fi
          python3 - << 'PYEOF'
          import glob, re
          for p in glob.glob("app/src/main/res/values*/strings.xml"):
              with open(p, "r", encoding="utf-8") as f:
                  txt = f.read()
              fixed = re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;|#\d+;|#x[0-9a-fA-F]+;)', '&amp;', txt)
              if fixed != txt:
                  with open(p, "w", encoding="utf-8") as f:
                      f.write(fixed)
                  print("Auto-fixed unescaped '&' in:", p)
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.5 Directly
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          sudo unzip -q -d /opt/gradle /tmp/gradle.zip
          echo "/opt/gradle/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build Signed Google Play Bundle (AAB) & Release APK
        run: |
          gradle bundleRelease assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/PureVideoPlayer-Release.aab
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/PureVideoPlayer-Release.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/PureVideoPlayer.apk

      - name: Upload Google Play Store Bundle (PureVideoPlayer-Release.aab)
        uses: actions/upload-artifact@v4
        with:
          name: PureVideoPlayer-GooglePlay-AAB
          path: app/build/outputs/bundle/release/PureVideoPlayer-Release.aab

      - name: Upload Direct Install APK (PureVideoPlayer-Release.apk)
        uses: actions/upload-artifact@v4
        with:
          name: PureVideoPlayer-Release-APK
          path: app/build/outputs/apk/release/PureVideoPlayer-Release.apk

      - name: Publish AAB & APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: Pure Video Player Latest Release (AAB + APK)
          files: |
            app/build/outputs/bundle/release/PureVideoPlayer-Release.aab
            app/build/outputs/apk/release/PureVideoPlayer-Release.apk
            app/build/outputs/apk/release/PureVideoPlayer.apk
          prerelease: false
