name: Build Pure Video Player APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.5 Directly
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          sudo unzip -q -d /opt/gradle /tmp/gradle.zip
          echo "/opt/gradle/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PureVideoPlayer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureVideoPlayer-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Latest APK to GitHub Releases (For In-App Auto Updater)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: Pure Video Player Latest Update
          files: app/build/outputs/apk/debug/PureVideoPlayer.apk
          prerelease: false
